name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_debug_log.txt

      - name: Report Failure Diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_FILE="failure_log.txt"
          echo "=== Build Failure Diagnostic ===" > "$LOG_FILE"
          for f in build_debug_log.txt; do
            if [ -f "$f" ]; then
              echo "--- Compiler / Error lines in $f ---" >> "$LOG_FILE"
              grep -E "(^e:|^w: |error:|Compilation error|FAILURE:|FAILED)" "$f" | head -n 50 >> "$LOG_FILE" || true
              echo "--- Log Tail: $f ---" >> "$LOG_FILE"
              tail -n 50 "$f" >> "$LOG_FILE"
              echo "" >> "$LOG_FILE"
            fi
          done
          gh issue create --title "Build Diagnostic #${{ github.run_number }}" --body "Automated build failure log:
          \`\`\`
          $(cat "$LOG_FILE" | head -n 140)
          \`\`\`" || true

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GitDroidStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK at: $DEBUG_APK"
            cp "$DEBUG_APK" GitDroidStudio-debug.apk
            ASSETS+=("GitDroidStudio-debug.apk")
          fi

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          NOTES="### GitDroid Studio Build #${{ github.run_number }}
          - **Debug APK**: \`GitDroidStudio-debug.apk\` (Native Jetpack Compose Android IDE ready to install)"

          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --title "GitDroid Studio Release #${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
